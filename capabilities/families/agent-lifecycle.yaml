    keywords: [a2a, responsibility, handoff, return, wake, ответственность, передача, возврат, пробуждение]

  - id: mode.agents.transfer-responsibility
    title: Transfer responsibility
    description: Establish a bounded A2A responsibility relation and hand a complete external incarnation request to an execution leaf.
    purpose: Transfer one exact obligation to a role-bearing actor without equating runtime transport with the A2A relation.
    kind: mode
    contract_level: executable
    primary_parent: agents.lifecycle.relationship
    owner: *family_owner
    lifecycle: *internal_lifecycle
    applicability:
      use_when: [Obligation, mandate, incarnation, current and intended holders, authority, outputs, return owner, and stop line are complete.]
      do_not_use_when: [Any owner input is missing or only a launcher command exists.]
      ambiguous_when: [The runtime can launch a process but the receiving actor has not explicitly accepted or narrowed the mandate.]
    abi:
      inputs:
        - {name: transfer-request, type: responsibility-transfer-request-v1, required: true, description: "Obligation, mandate, holders, authority, outputs, return, refusal, wake, and stop posture."}
        - {name: incarnation, type: agent-incarnation-binding-ref-v1, required: true, description: Exact replaceable runtime binding.}
      outputs:
        - {name: transfer, type: responsibility-transfer-v1, required: true, description: "Accepted, narrowed, refused, or launched responsibility relation with evidence classes."}
        - {name: execution-request, type: summon-request-v3, required: false, description: Complete immutable external execution-leaf request emitted only after responsibility transfer is admitted.}
    binding: {kind: mode, ref: skills/aoa-agents-skills/references/transfer-responsibility.md, operation: transfer-responsibility, availability: available}
    execution: *bounded_execution
    trust: *runtime_trust
    provenance:
      source_refs: [{repo: aoa-agents, path: skills/aoa-agents-skills/references/transfer-responsibility.md, ref: capability-home-v0.1.0, role: internal-mode, authority: authored}]
      optional_refs:
        - {repo: aoa-sdk, path: mechanics/boundary-bridge/parts/agent-incarnation-binding/schemas/agent-incarnation-binding.schema.json, ref: agent-incarnation-binding-v1, role: runtime-planning-owner-contract, authority: external-authority}
        - {repo: abyss-stack, path: mechanics/governed-execution/parts/external-codex-agent/runtime-profile.v1.json, ref: external-codex-runtime-v1, role: external-runtime-owner-contract, authority: external-authority}
    mutation:
