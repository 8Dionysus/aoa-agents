      postconditions: [Every executable state carries a real inspected binding and handle., Every accepted return matches the immutable named-output set.]
    security: {permissions: [read-parent-anchor, invoke-host-delegation], network: optional-explicit, external_dependencies: [aoa-sdk, abyss-stack], untrusted_input: runtime-policy-enforced}
