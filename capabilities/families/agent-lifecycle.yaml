  - id: skill.aoa-summon
    title: aoa-summon execution leaf
    description: Execute one bounded actor route only after aoa-agents-skills has classified responsibility and supplied a complete external execution leaf, or after it has returned a typed not_independent disposition for an explicitly requested disposable Codex-local child whose complete anchored packet carries the resolved classification artifact and child-duty digest, names outputs, and names a return owner. This leaf consumes only a resolved summon-request-v4 with transport_preference codex_local or external_cli; unresolved aoa-sdk a2a_remote/either requests and generic delegation must remain with their owning routing control plane. Generic requests for an agent, sub-agent, worker, reviewer, researcher, delegation, parallel work, or background work must route to aoa-agents-skills before this skill or any built-in Codex tool such as spawn_agent. Use the external CLI lane for an independently bound incarnation. An incomplete request must block.
    purpose: Preserve one anchored execution request, real host binding, runtime handle, named return validation, and parent closeout while the external incarnation ABI is evolved.
    kind: skill
    contract_level: executable
    primary_parent: agents.lifecycle.execution
    owner: {repo: aoa-agents, surface: skills/aoa-summon/SKILL.md, authority: authored}
    lifecycle:
      state: active
      version: 0.4.0
      visibility: advertised
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - aoa-agents-skills selects this execution leaf from a complete task-local actor DAG with an admitted transfer and return owner.
        - The user explicitly requests a disposable Codex-local child and aoa-agents-skills has classified it not_independent before a complete anchored local-child packet is supplied.
      do_not_use_when: [The request is incomplete, implicit, unsplit deep work, or intended to widen authority.]
      ambiguous_when: [A generic delegation request has not yet passed through aoa-agents-skills responsibility classification.]
    abi:
      inputs:
        - {name: request, type: summon-request-v4, required: true, description: "Immutable anchored request with named outputs, child scope, inputs, return owner, resolved not_independent classification artifact and child-duty digest for codex_local, and exact external-incarnation evidence where applicable."}
      outputs:
        - {name: result, type: summon-result-v4, required: true, description: "Decision, inspected binding, exact incarnation evidence, runtime handle, output validation, and closeout handoff."}
    binding: {kind: skill, ref: skills/aoa-summon/SKILL.md, operation: decide-or-execute, availability: available}
    execution:
      freedom: bounded-judgment
      tool_requirements: [parent anchor and request packet, exact local classification resolver binding the child-duty digest, callable host delegation for execute mode]
      verification: [A plan is never reported as launch., Every named output and actual effect returns through the immutable request., Binding availability follows real interface inspection.]
      termination: [Stop after one decision or one real return and parent closeout., "Block when request, gate, binding, output, or return owner is absent."]
      effects: [none, runtime-mutation]
      reversibility: reversible
      failure_modes: [Triggering directly from a generic delegation request., Calling spawn_agent before aoa-agents-skills classification., Dropping the typed classification result ref across the skill boundary., Replaying a classification against a changed child duty., Using an uninspected binding., Treating built-in child spawn as a separate external incarnation., Accepting missing or extra outputs., Widening authority.]
    trust: *runtime_trust
