schema_version: aoa-capability-family-v1
family_id: agent-lifecycle
title: aoa-agents skill tree
description: Classify responsibility for presented agent-tool decisions, preserve independent obligation pressure, and carry role-bearing responsibility through replaceable incarnation, external execution, return, and wake without owning runtime dispatch.
owner: &family_owner
  repo: aoa-agents
  surface: capabilities/families/agent-lifecycle.yaml
  authority: authored

nodes:
  - id: aoa-agents
    title: AoA agents
    description: Own role-bearing actor meaning, responsibility posture, and the agent lifecycle skill tree without owning runtime dispatch or domain procedures.
    kind: capability
    contract_level: navigation
    primary_parent: null
    owner: *family_owner
    lifecycle: &navigation_lifecycle
      state: active
      version: 1.0.0
      visibility: internal
      evidence_state: owner-verified
      health: healthy
    keywords: [agents, roles, responsibility, actors, агенты, роли, ответственность]

  - id: aoa-agents-skills
    title: aoa-agents-skills tree
    description: Classify a responsibility boundary explicitly presented to this owner-local stage and navigate obligation detection, actor formation, replaceable incarnation, responsibility transfer, external execution, return, wake, and progression leaves without owning route policy or transport dispatch.
    kind: capability
    contract_level: navigation
    primary_parent: aoa-agents
    owner: *family_owner
    lifecycle: *navigation_lifecycle
    keywords: [agent-skills, obligation, incarnation, a2a, return, wake, обязанность, воплощение, возврат]

  - id: skill.aoa-agents-skills
    title: aoa-agents-skills organ router
    description: Owner-local responsibility classification and actor lifecycle for a boundary explicitly presented by the aoa-sdk routing control plane or current holder. Use only when that owner invokes this owner-local stage or explicitly re-enters it after compaction, resume, or re-entry; return a typed responsibility-classification-v1 not_independent result with a child-duty digest or the independent-duty classification and hand the result back. This skill is not a universal pre-tool hook and does not select transport, tools, or repository-wide navigation; the routing control plane owns that dispatch. Also use to bind an incarnation, transfer responsibility, or receive and filter a return. Do not use merely because compute is available, to own a domain procedure, to select a model brand without fit evidence, or to equate transport with A2A responsibility.
    purpose: Classify the presented responsibility boundary and route the smallest owner-local actor lifecycle node or task-local DAG after the routing owner invokes this stage.
    kind: skill
    contract_level: executable
    primary_parent: aoa-agents-skills
    owner:
      repo: aoa-agents
      surface: skills/aoa-agents-skills/SKILL.md
      authority: authored
    lifecycle: &root_candidate_lifecycle
      state: active
      version: 0.5.0
      visibility: advertised
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - The owning routing control plane or current holder presents an agent-tool decision whose responsibility boundary is not yet classified.
        - The aoa-sdk routing control plane or current holder explicitly presents an agent-tool or delegation decision whose responsibility boundary is not yet classified.
        - Goal planning, execution, or closeout exposes a duty that may need an independently addressable responsibility bearer.
        - An existing persistent role may need rebinding, return filtering, or controlled wake.
      do_not_use_when:
        - No agent-tool decision, delegation pressure, or independent-duty pressure exists.
      ambiguous_when:
        - A proposed local split may instead need an independent reviewer, continuity holder, or return owner; classify it here before choosing a tool.
    abi:
      inputs:
        - {name: pressure, type: goal-pressure-v1, required: true, description: "Goal, phase, current holder, observed or anticipated duty, owner, independence signals, and uncertainty."}
      outputs:
        - {name: lifecycle-result, type: agent-lifecycle-result-v1, required: true, description: One typed mode result or smallest task-local DAG with explicit responsibility movement and stop line; the ordinary-local branch also emits responsibility-classification-v1.}
    binding: {kind: skill, ref: skills/aoa-agents-skills/SKILL.md, operation: route-lifecycle, availability: available}
    execution: &bounded_execution
      freedom: bounded-judgment
      tool_requirements: [owner source read access, stronger-owner bindings only for selected lifecycle nodes]
      verification: ["Every transition preserves goal, obligation, mandate, owner, responsibility holder, evidence class, and stop line.", "Model, process, transport, and domain procedure remain replaceable owner-bound bindings."]
      termination: [Stop after one bounded transition or smallest valid task-local chain., "Stop at the first missing owner, authority, fit, runtime, return, or wake input."]
      effects: [none, runtime-mutation]
      reversibility: reversible
      failure_modes: [Selecting transport before responsibility classification., Treating this classifier as universal dispatch authority., Emitting an untyped not_independent disposition., Skipping classification after compaction or re-entry., Creating an actor because a model is available., Encoding a model brand in a stable role., Treating a launcher or process handle as A2A responsibility., Absorbing a domain procedure., Treating a task-local DAG as durable source.]
    trust: &runtime_trust
      public_safe: true
      requires_human_approval: true
      posture: authored-procedure
    provenance:
      source_refs:
        - {repo: aoa-agents, path: skills/aoa-agents-skills/SKILL.md, ref: capability-home-v0.5.0, role: owner-skill-procedure, authority: authored}
        - {repo: aoa-agents, path: skills/aoa-agents-skills/references/responsibility-classification-v1.schema.json, ref: responsibility-classification-v1, role: local-classification-schema, authority: authored}
      optional_refs:
        - {repo: aoa-models, path: schemas/model-fit-projection.schema.json, ref: model-fit-projection-v1, role: model-fit-owner-contract, authority: external-authority}
        - {repo: aoa-sdk, path: mechanics/boundary-bridge/parts/agent-incarnation-binding/schemas/agent-incarnation-binding-v2.schema.json, ref: agent-incarnation-binding-v2, role: runtime-planning-owner-contract, authority: external-authority}
        - {repo: abyss-stack, path: mechanics/governed-execution/parts/external-codex-agent/runtime-profile.v1.json, ref: external-codex-runtime-v1, role: external-runtime-owner-contract, authority: external-authority}
    classification: {category: independent-callable, disposition: retain, rationale: "External workspace-write, independent return, controlled re-entry, filtering, and ambiguity evidence admit the obligation router as a challenger; model fit and effect routes remain separately unadmitted."}
    procedure: &root_procedure
      ref: skills/aoa-agents-skills/SKILL.md
      required_sections: [Agent-tool responsibility classification, Applicability preflight, Start, Organ boundary, Execution leaf, Verification and stop]
      runtime_adaptation: Resolve logical owner, model-fit, SDK binding, and runtime roots independently before executing a selected leaf.
    mutation:
      preview_required: true
      explicit_apply_required: true
      rollback_or_recovery: [Pause or terminate only the exact external actor process through its runtime owner., Return responsibility to the previous holder and preserve the task-local obligation as unresolved.]
      postconditions: [A launched actor has separate process and session handles., Responsibility and return ownership remain explicit., Usage is counted from receipts without a budget gate.]
    security:
      permissions: [read-owner-source, form-task-local-mandate, invoke-admitted-external-runtime]
      network: optional-explicit
      external_dependencies: [aoa-models, aoa-sdk, abyss-stack]
      untrusted_input: treat-as-data
    keywords: [agent-tool, spawn_agent, sub-agent, delegation, worker, reviewer, obligation, actor, role, incarnation, external-cli, responsibility, a2a, return, wake, агент, делегирование, обязанность, актор, воплощение, ответственность]

  - id: mode.agents.role-first-entry
    title: Role-first actor entry
    description: Accept one semantic Goal request with prepare or execute intent and compose the existing obligation, role, fit, incarnation, transfer, external execution, and return owners without exposing their low-level packets to the caller.
    purpose: Turn a Goal, independent duty, authority envelope, and expected result into the smallest valid role-bearing external actor route.
    kind: mode
    contract_level: executable
    primary_parent: skill.aoa-agents-skills
    owner: *family_owner
    lifecycle:
      state: candidate
      version: 0.2.0
      visibility: internal
      evidence_state: manual-baseline
      health: challenger
    applicability:
      use_when:
        - The current holder explicitly requests that an independent Goal duty be formed and embodied as an actor.
        - A complete direct imperative assigns, forms, launches, or delegates an independent actor and therefore carries execute intent.
      do_not_use_when:
        - The pressure is an ordinary step, convenience split, available-compute opportunity, or model-launch request.
      ambiguous_when:
        - Goal, duty, authority, expected result, current holder, or return owner is incomplete or contradictory.
    abi:
      inputs:
        - {name: intent, type: role-first-intent-v1, required: true, description: "Goal, independent duty, authority envelope, and named expected results."}
      outputs:
        - {name: normalized-pressure, type: goal-pressure-v1, required: false, description: Internal pressure context passed to obligation detection.}
        - {name: lifecycle-result, type: agent-lifecycle-result-v1, required: true, description: "Typed lifecycle result with responsibility movement, external handles, filtered return, or exact stop route; a not_independent local branch includes responsibility-classification-v1."}
    binding: {kind: mode, ref: skills/aoa-agents-skills/references/role-first-entry.md, operation: role-first-entry, availability: available}
    execution:
      freedom: bounded-judgment
      tool_requirements: [active Goal/session context, owner source gate, aoa-models fit query, aoa-sdk RunPlan compiler, abyss-stack external runtime, aoa-summon passive preparer]
      verification: [The caller supplied only semantic fields., "The obligation, role, model-fit, SDK, runtime, transfer, summon, and return refs remain owner-qualified.", "External execution uses a separate process and session without built-in Codex child agents.", Responsibility and filtered return identify the next holder.]
      termination: [Stop at the first missing or contradictory semantic or stronger-owner input., "Stop after one bounded lifecycle route and named return or unresolved next owner."]
      effects: [none, runtime-mutation]
      reversibility: conditionally-reversible
      failure_modes: [Autospawning from a keyword without explicit semantic delegation., Demanding a redundant second apply after a complete execute request., Inferring execute from a mere agent mention., Asking the caller to hand-build low-level packets., Selecting a role by model brand., Selecting a model without current fit evidence., Treating configured runtime state as a launched actor., Treating transport as responsibility., Accepting an unfiltered return.]
    trust: {public_safe: true, requires_human_approval: true, posture: human-authorized}
    provenance:
      source_refs:
        - {repo: aoa-agents, path: skills/aoa-agents-skills/references/role-first-entry.md, ref: capability-home-v0.5.0, role: semantic-entry-procedure, authority: authored}
        - {repo: aoa-agents, path: skills/aoa-agents-skills/references/role-first-intent-v1.schema.json, ref: role-first-intent-v1, role: semantic-entry-schema, authority: authored}
      optional_refs:
        - {repo: aoa-models, path: scripts/query_model_fit.py, ref: model-fit-query-owner, role: model-fit-owner-contract, authority: external-authority}
        - {repo: aoa-sdk, path: mechanics/boundary-bridge/parts/agent-incarnation-binding/schemas/agent-incarnation-binding-v2.schema.json, ref: agent-incarnation-binding-v2, role: runtime-planning-owner-contract, authority: external-authority}
        - {repo: abyss-stack, path: mechanics/governed-execution/parts/external-codex-agent/runtime-profile.v1.json, ref: external-codex-runtime-v1, role: external-runtime-owner-contract, authority: external-authority}
    classification: {category: local-mode, disposition: retain, rationale: "One semantic front door is useful inside the existing advertised organ router; its owner modes and external leaf remain separately addressable and its trigger is explicit."}
    procedure: {ref: skills/aoa-agents-skills/references/role-first-entry.md, required_sections: [Applicability, Input, Procedure, Owner handoffs, Output, Verification and stop], runtime_adaptation: "Resolve active session context and stronger owners independently; do not expose or persist low-level packet assembly as caller procedure."}
    mutation:
      preview_required: true
      explicit_apply_required: true
      rollback_or_recovery: [Pause or terminate only the exact runtime-owned external process., Return unresolved responsibility to the current holder and preserve the task-local obligation., Rebind a replaceable model incarnation without mutating stable role meaning.]
      postconditions: [The route is content-addressed by owner compilers., "Prepare intent awaits apply; a complete direct execute request supplies same-request apply authority.", "A launched actor has separate process, session, state, and continuation evidence.", "The parent holder and next return holder are explicit.", Usage is observed without a budget gate.]
    security: {permissions: [read-owner-source, form-task-local-mandate, invoke-admitted-external-runtime], network: optional-explicit, external_dependencies: [aoa-models, aoa-sdk, abyss-stack, named-domain-owner, aoa-skills], untrusted_input: treat-as-data}
    keywords: [role-first, semantic-entry, independent-duty, form-actor, embody-actor, external-actor, responsibility, роль, обязанность, воплотить]

  - id: agents.lifecycle.pressure
    title: Obligation pressure
    description: Distinguish an independently owned duty from an ordinary step or available-compute opportunity.
    kind: capability
    contract_level: navigation
    primary_parent: skill.aoa-agents-skills
    owner: *family_owner
    lifecycle: *navigation_lifecycle
    keywords: [pressure, obligation, future-duty, trigger, давление, обязанность, триггер]

  - id: mode.agents.detect-obligation
    title: Detect independent obligation
    description: Test current or anticipated pressure and assign one bounded trigger strength without launching an actor.
    purpose: Return one bounded independent-obligation disposition and trigger strength without selecting a model or runtime.
    kind: mode
    contract_level: executable
    primary_parent: agents.lifecycle.pressure
    owner: *family_owner
    lifecycle: &internal_lifecycle
      state: candidate
      version: 0.2.0
      visibility: internal
      evidence_state: hypothesis
      health: challenger
    applicability:
      use_when: [A goal phase exposes current or future duty pressure whose responsibility boundary is unresolved.]
      do_not_use_when: [An admitted obligation already exists or the work is clearly an ordinary step.]
      ambiguous_when: [A convenience split resembles independent review but has no separate authority or return need.]
    abi:
      inputs:
        - {name: pressure, type: goal-pressure-v1, required: true, description: Anchored duty pressure and independence evidence.}
      outputs:
        - {name: obligation, type: agent-obligation-v1, required: true, description: Admitted obligation or explicit not-independent disposition with trigger strength.}
    binding: {kind: mode, ref: skills/aoa-agents-skills/references/detect-obligation.md, operation: detect-obligation, availability: available}
    execution: &read_execution
      freedom: bounded-judgment
      tool_requirements: [goal and owner source read access, passive obligation packet compiler]
      verification: [Positive and negative independence signals are explicit., The admitted packet is content-addressed., No model or runtime was selected.]
      termination: [Stop after one obligation disposition and trigger strength.]
      effects: [none]
      reversibility: not-applicable
      failure_modes: [Autospawn from a keyword., Mistaking task decomposition for responsibility., Using cheap compute as the cause.]
    trust: &read_trust {public_safe: true, requires_human_approval: false, posture: authored-procedure}
    provenance: {source_refs: [{repo: aoa-agents, path: skills/aoa-agents-skills/references/detect-obligation.md, ref: capability-home-v0.2.0, role: internal-mode, authority: authored}], optional_refs: []}
    classification: &internal_classification {category: local-mode, disposition: retain, rationale: Internal lifecycle stage composes through the organ root and has no independent prompt trigger evidence.}
    procedure: {ref: skills/aoa-agents-skills/references/detect-obligation.md, required_sections: ["Mode: detect-obligation", Input, Procedure, Output], runtime_adaptation: Use the current goal and owner sources; do not probe model or runtime surfaces.}
    security: &read_security {permissions: [read-owner-source], network: forbidden, external_dependencies: [], untrusted_input: treat-as-data}
    keywords: [detect, independent-duty, trigger-strength, future-obligation, обнаружить, самостоятельная-обязанность]

  - id: mode.agents.responsibility-classification
    title: Responsibility classification
    description: Emit one typed not_independent result for a presented ordinary-local agent-tool decision before a Codex-local child lane is considered.
    purpose: Preserve the owner-produced negative classification, its goal, holder, execution epoch, and child-duty digest anchors, and its bounded local next route across skill boundaries.
    kind: mode
    contract_level: executable
    primary_parent: skill.aoa-agents-skills
    owner: *family_owner
    lifecycle: *internal_lifecycle
    applicability:
      use_when: [A presented agent-tool responsibility boundary is an ordinary local step after the owner classifier evaluates independence.]
      do_not_use_when: [An independent obligation exists, no agent-tool decision was presented, or the route is already an admitted external leaf.]
      ambiguous_when: [The current holder has not supplied a goal, holder ref, reason, or stop line for the classification.]
    abi:
      inputs:
        - {name: pressure, type: goal-pressure-v1, required: true, description: Anchored goal pressure and responsibility-holder evidence.}
      outputs:
        - {name: classification, type: responsibility-classification-v1, required: true, description: Content-addressed not_independent result with a child-duty digest permitting only the codex_local compatibility route.}
    binding: {kind: mode, ref: skills/aoa-agents-skills/references/responsibility-classification.md, operation: responsibility-classification, availability: available}
    execution: &classification_execution
      freedom: bounded-judgment
      tool_requirements: [goal and holder read access, passive classification packet compiler]
      verification:
        - The result is a typed responsibility-classification-v1 artifact with its semantic digest and fresh execution epoch.
        - Goal, current holder, execution epoch, child-duty subject, and codex_local next route remain exact.
        - The classifier selects no agent tool, model, runtime, or transport implementation; it only preserves the typed codex_local compatibility route.
      termination:
        - Stop after one responsibility classification and its owner return route.
        - Stop if the goal, holder, child duty, or stop line is missing or contradictory.
      effects: [none]
      reversibility: not-applicable
      failure_modes:
        - Reconstructing a classification from prompt prose instead of an owner artifact.
        - Treating not_independent as permission to bypass the aoa-summon leaf.
        - Treating an execution-epoch match as proof of one-time consumption; same-epoch replay control belongs to runtime or owner state.
    trust: *read_trust
    provenance:
      source_refs:
        - {repo: aoa-agents, path: skills/aoa-agents-skills/references/responsibility-classification.md, ref: responsibility-classification-procedure, role: local-classification-procedure, authority: authored}
        - {repo: aoa-agents, path: skills/aoa-agents-skills/references/responsibility-classification-v1.schema.json, ref: responsibility-classification-v1, role: local-classification-schema, authority: authored}
      optional_refs: []
    classification: *internal_classification
    procedure: {ref: skills/aoa-agents-skills/references/responsibility-classification.md, required_sections: ["Mode: responsibility-classification", Input, Procedure, Output, Verification], runtime_adaptation: Preserve the exact typed result and do not select a tool or runtime.}
    security: *read_security
    keywords: [responsibility-classification, not-independent, codex-local, typed-result, responsibility, классификация-ответственности]

  - id: mode.agents.form-actor
