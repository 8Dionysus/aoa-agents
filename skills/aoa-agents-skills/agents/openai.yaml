  short_description: "Classify responsibility for delegation"
  default_prompt: "Use $aoa-agents-skills when a routing or delegation decision presents an unresolved responsibility boundary; classify it before transport is selected, route independent duties to a separately addressable external CLI actor, and treat a complete explicit execution request as apply authority."

