interface:
  display_name: "AoA Summon"
  short_description: "Execute and return one bounded actor route"
  default_prompt: "Use $aoa-summon only for a resolved summon-request-v4: $aoa-agents-skills must supply a complete external execution leaf, or return not_independent for an explicitly requested disposable Codex-local child whose request carries and validates the exact responsibility classification artifact. Unresolved aoa-sdk a2a_remote/either transports and generic delegation are not summon authority."

policy:
