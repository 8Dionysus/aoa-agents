schema_version: aoa-skill-contract-v1
identity:
  name: aoa-summon
  owner: aoa-agents
  version: 0.3.0
  health: challenger
purpose: Decide or execute one anchored actor route through a compatibility child lane or exact external CLI incarnation and return responsibility to closeout.
applicability:
  positive: explicit delegation intent, summon-law question, or complete aoa-agents-skills external execution leaf with an anchored goal route
  negative: incomplete request ABI, generic implicit background work, unresolved fork, unnamed output, unsplit d3+, or obligation, mandate, incarnation, approval, owner, or proof gate bypass
input_abi:
  type: summon-request-v3
  schema: summon-request-v3.schema.json
  required_additions:
    - intent
    - return_owner
    - child_scope
    - child_stop_line
    - child_inputs
    - request_ref
    - request_digest
    - external_incarnation when transport_preference is external_cli
output_abi:
  type: summon-result-v3
  schema: summon-result-v3.schema.json
  required_additions:
    - decision_state
    - binding
    - runtime_state
    - return_validation
    - closeout_handoff
    - actual_effects
    - stop_line
    - request_ref
    - request_digest
    - request_intent
modes:
  decide:
    effects: [none]
    reference: lane-and-return.md
  execute:
    effects: [child-agent-runtime, external-actor-runtime]
    reference: lane-and-return.md
freedom_level: bounded-judgment
tool_requirements:
  - Read access to parent passport, anchor, gates, and relevant owner contracts.
  - A callable compatibility child interface or exact external CLI incarnation runtime and return interface for execute mode.
execution_states:
  - decided
  - blocked
  - launched
  - running
  - returned
  - accepted
  - failed
termination:
  success: decision-only result or one actor return validated and handed to responsibility closeout
  blocked: request ABI, anchor, literal inputs, outputs, gates, execution authority, or host binding is unavailable
relations:
  - {kind: requires, target: guard.operations.approval, condition: actor effects require approval}
  - {kind: consumes, target: progression-delta-candidate, condition: only after aoa-agents owner review when progression is required}
  - {kind: hands-off-to, target: aoa-checkpoint-closeout-bridge, condition: actor return changes goal checkpoint or closeout posture}
  - {kind: hands-off-to, target: aoa-memo-writeback, condition: reviewed actor return contains one bounded memory-worthy lesson}
trust:
  posture: owner-authored-procedure
  runtime_authority: host-only
  proof_authority: false
provenance:
  source: skills/aoa-summon
  source_return: same-bundle install handle or matching aoa-agents owner-home manifest
  owner_contracts:
    - mechanics/rpg/parts/progression-model
    - mechanics/titan/parts/summon-boundary
  techniques_runtime_dependency: false
failure_modes:
  - incomplete route-shaped prompt reported as an allowed summon request
  - missing child input or contract ref inferred or minted
  - plan reported as launched child
  - decision-only plan reported an uninspected host binding as available
  - child launched without explicit intent or a parent anchor
  - output accepted without return validation
  - output names duplicated or omitted by a second aggregate list
  - available binding carries a contradictory failure reason
  - allowed execution remains in the non-run state
  - result output keys are accepted without resolving and matching the immutable request
  - execute intent terminates as a decision-only plan
  - request names expected outputs in more than one place
  - failed child state loses its runtime binding, handle, or effect
  - retired result expected-output list reappears beside the canonical map
  - child scope widened or gate bypassed
  - raw trace promoted to proof or memory truth
  - external actor route executed without obligation, mandate, task-local DAG, incarnation, responsibility, domain procedure, continuation, or return-event refs
  - owner-local summon receipt presented as a replacement for the aoa-sdk A2A decision or abyss-stack runtime return
  - accepted external return lacks exact SDK summon request/decision or runtime result/A2A-return/usage refs
  - built-in Codex child lane reported as a separate external CLI incarnation
  - external usage observations converted into a pre-emptive budget gate
