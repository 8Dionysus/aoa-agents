schema_version: aoa-skill-contract-v1
identity:
  name: aoa-summon
  owner: aoa-agents
  version: 0.4.0
  health: challenger
purpose: Decide or execute one anchored actor route through a compatibility child lane or exact external CLI incarnation and return responsibility to closeout.
applicability:
  positive: explicit delegation intent, summon-law question, or complete aoa-agents-skills external execution leaf with an anchored goal route
  negative: incomplete request ABI, generic implicit background work, unresolved fork, unnamed output, unsplit d3+, or obligation, mandate, incarnation, approval, owner, or proof gate bypass
input_abi:
  type: summon-request-v4
  schema: summon-request-v4.schema.json
  required_additions:
    - intent
    - return_owner
    - child_scope
    - child_stop_line
    - child_inputs
    - request_ref
    - request_digest
    - external_incarnation with an admitted aoa-agents responsibility transfer when transport_preference is external_cli
    - role_resolution_ref, model_fit_query_result_ref, model_fit_projection_ref, and aoa-sdk incarnation binding v2 for external_cli
output_abi:
  type: summon-result-v4
  schema: summon-result-v4.schema.json
  required_additions:
    - decision_state
    - binding
    - runtime_state
    - return_validation
    - closeout_handoff
    - actual_effects
    - stop_line
    - request_ref
    - request_digest
    - request_intent
    - the exact role-resolution, model-fit query, selected fit projection, and incarnation-binding-v2 refs for external_cli
modes:
  decide:
    effects: [none]
    reference: lane-and-return.md
  execute:
    effects: [child-agent-runtime, external-actor-runtime]
    reference: lane-and-return.md
freedom_level: bounded-judgment
tool_requirements:
  - Read access to parent passport, anchor, gates, and relevant owner contracts.
  - A callable compatibility child interface or exact external CLI incarnation runtime and return interface for execute mode.
  - The passive external request compiler consumes only complete exact owner files and never inspects or starts a host binding.
  - The passive external result compiler consumes only a terminal runtime result and reviewed A2A return and never launches, reviews, or mints a stronger-owner artifact.
execution_states:
  - decided
  - blocked
  - launched
  - running
  - returned
  - accepted
  - failed
termination:
  success: decision-only result or one actor return validated and handed to responsibility closeout
  blocked: request ABI, anchor, literal inputs, outputs, gates, execution authority, or host binding is unavailable
relations:
  - {kind: requires, target: guard.operations.approval, condition: actor effects require approval}
  - {kind: consumes, target: progression-delta-candidate, condition: only after aoa-agents owner review when progression is required}
  - {kind: hands-off-to, target: aoa-checkpoint-closeout-bridge, condition: actor return changes goal checkpoint or closeout posture}
  - {kind: hands-off-to, target: aoa-memo-writeback, condition: reviewed actor return contains one bounded memory-worthy lesson}
trust:
  posture: owner-authored-procedure
  runtime_authority: host-only
  proof_authority: false
result_compiler:
  script: scripts/compile_external_execution_result.py
  input_chain:
    - summon-request-v4
    - exact aoa-agents actor-mandate-v1 artifact selected by both the request and incarnation binding
    - aoa-sdk summon request and decision
    - exact aoa-sdk incarnation-binding-v2 artifact selected by the request
    - abyss-stack terminal external-codex result-v2
    - abyss-stack runtime-profile-v2 ref
    - abyss-stack reviewed A2A return-v1
  output_posture: owner-local summon-result-v4 closeout receipt
  usage_posture: exact JSON-pointer locator into the terminal result; an optional exact content ref supplied through --usage-observation-ref may only assert that canonical object identity and subtree digest and cannot replace it; complete requires no gaps and partial requires at least one canonical gap
  derivative_posture: actor-safe input envelopes are addressed by their exact envelope bytes; an embedded unattested source_artifact_digest is not promoted to stronger-owner identity; every envelope must retain a nonempty source schema ref and version, and that version must equal either the unwrapped payload schema version or the explicit expected owner schema version for a schema-less payload
  output_posture_detail: output must be a new file and is never replaced
  prohibited_authority:
    - runtime launch or control
    - role or model selection
    - SDK, runtime, A2A, stats, proof, or owner-acceptance artifact minting
  acceptance_rule: accepted only when the summon-request-v4 schema and digest pass, its complete summon body and passport equal an a2a_remote or either SDK request under the one documented external_cli transport translation, its single effect is read_only or repo_mutation, the exact mandate artifact passes its owner schema and semantic digest and binds the same obligation, role resolution, selected role, ordered domain procedures, tool and MCP ceilings, effect and sandbox posture, and return owner carried by the request and binding, the request tool scope equals the binding tool ceiling, the transfer prior holder equals the concrete mandate/request return owner, and the SDK continuation retains that owner's repository, the terminal runtime owner-admission ref binds the exact owner request identity and bytes and therefore the launch chain, the exact incarnation-binding-v2 artifact retains its complete strict owner shape and semantic digest including run-plan and model-realization refs, those two exact refs also match the owner request, the binding binds the complete logical request incarnation, continuation without stale same-identity refs, effect, and runtime-profile ref, and preserves one aoa-models source across model realization and fit projection, every runtime invocation thread_id equals the terminal physical thread_id, the terminal runtime is completed with its canonical result.validated event, every actor envelope retains a nonempty source schema ref and a provenance version that agrees with its payload or explicit expected owner schema, the reviewed A2A return binds the complete original SDK request ref plus the terminal runtime result, its remote task task_id and agent_id exactly match the terminal runtime task_id and incarnation_id, and it has proceed disposition, the canonical noncontradictory usage observation is present, and every requested output is returned exactly once with no extra artifact
provenance:
  source: skills/aoa-summon
  source_return: same-bundle install handle or matching aoa-agents owner-home manifest
  owner_contracts:
    - mechanics/rpg/parts/progression-model
    - mechanics/titan/parts/summon-boundary
  techniques_runtime_dependency: false
failure_modes:
  - incomplete route-shaped prompt reported as an allowed summon request
  - missing child input or contract ref inferred or minted
  - plan reported as launched child
  - decision-only plan reported an uninspected host binding as available
  - child launched without explicit intent or a parent anchor
  - output accepted without return validation
  - output names duplicated or omitted by a second aggregate list
  - available binding carries a contradictory failure reason
  - allowed execution remains in the non-run state
  - result output keys are accepted without resolving and matching the immutable request
  - execute intent terminates as a decision-only plan
  - request names expected outputs in more than one place
  - failed child state loses its runtime binding, handle, or effect
  - retired result expected-output list reappears beside the canonical map
  - child scope widened or gate bypassed
  - raw trace promoted to proof or memory truth
  - external actor route executed without obligation, mandate, task-local DAG, incarnation, responsibility, domain procedure, continuation, or return-event refs
  - owner-local summon receipt presented as a replacement for the aoa-sdk A2A decision or abyss-stack runtime return
  - accepted external return lacks exact SDK summon request/decision or runtime result/A2A-return/usage refs
  - new execution launches from historical summon-request-v3 or emits summon-result-v3
  - external request, binding, and return disagree about role-resolution or model-fit evidence
  - built-in Codex child lane reported as a separate external CLI incarnation
  - external usage observations converted into a pre-emptive budget gate
